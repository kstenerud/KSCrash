# Measures what KSCrash adds to an app: the BinarySize apps in Samples/Project.swift are
# linked for iOS with dead stripping, and binary_size.py reads their link maps.
name: Binary Size

on:
  pull_request:
    paths:
      - "Sources/**"
      - "Package.swift"
      - "Samples/Project.swift"
      - "Samples/BinarySize/**"
      - "Samples/Common/**"
      - ".github/workflows/binary-size.yml"
      - ".github/scripts/binary_size.py"

  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  binary-size:
    # The Xcode 27 image: CorpseReporter links CrashReportExtension, which only
    # the iOS 27 SDK has, and macos-15 carries no Xcode 27.
    runs-on: xcode-27
    steps:
      # Each checkout ends in KSCrash: Samples/Common names the package by its
      # directory, and the package identity has to be "KSCrash".
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          path: pr/KSCrash

      - name: Checkout Base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base/KSCrash

      # Beta-only images must ask for 'latest', not 'latest-stable': setup-xcode
      # treats any Xcode whose LicenseInfo.plist says "beta" as unstable.
      - name: Use Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          working_directory: pr/KSCrash
        env:
          # Only trust the specific .mise.toml config files to reduce security risk.
          # See: https://mise.jdx.dev/docs/configuration/security
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/pr/KSCrash/.mise.toml:${{ github.workspace }}/base/KSCrash/.mise.toml

      - name: Build PR (iOS Release)
        working-directory: pr/KSCrash/Samples
        run: |
          mise exec -- tuist generate --no-open
          xcodebuild build \
            -workspace KSCrashSamples.xcworkspace \
            -scheme BinarySize \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/pr/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            LD_GENERATE_MAP_FILE=YES \
            -quiet

      # A base from before the BinarySize apps existed has nothing to compare against.
      - name: Build Base (iOS Release)
        if: github.event_name == 'pull_request'
        working-directory: base/KSCrash/Samples
        run: |
          if ! grep -q '"BinarySize"' Project.swift; then
            echo "The base has no BinarySize apps; the report has no deltas."
            exit 0
          fi
          mise exec -- tuist generate --no-open
          xcodebuild build \
            -workspace KSCrashSamples.xcworkspace \
            -scheme BinarySize \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/base/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            LD_GENERATE_MAP_FILE=YES \
            -quiet

      - name: Measure Binary Sizes
        run: |
          if [ -d base/DerivedData ]; then
            python3 pr/KSCrash/.github/scripts/binary_size.py \
              --build-dir pr/DerivedData \
              --base-build-dir base/DerivedData \
              --repo-root pr/KSCrash \
              --output binary_size.md
          else
            python3 pr/KSCrash/.github/scripts/binary_size.py \
              --build-dir pr/DerivedData \
              --repo-root pr/KSCrash \
              --output binary_size.md
          fi

      - name: Job Summary
        run: cat binary_size.md >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with Results
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: binary_size.md
          comment-tag: binary-size

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: binary-size-report
          path: binary_size.md
