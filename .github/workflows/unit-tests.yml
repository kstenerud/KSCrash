name: Run Unit Tests

on:
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - ".github/workflows/unit-tests.yml"
      - ".swiftpm/xcode/xcshareddata/xcschemes/**"

  push:
    branches:
      - master

  schedule:
    - cron: "0 0 1 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # Most entries pick a runner by macOS version. The Xcode 27 preview image is
    # published under a bare "xcode-27" label instead, so entries may override the
    # whole label via matrix.runner.
    runs-on: ${{ matrix.runner || format('macos-{0}', matrix.macos-version || 'latest') }}
    # The Xcode 27 image is a preview: unstable software and capacity queuing are
    # expected, so it reports signal without gating merges.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            macos-version: "15"
          - platform: iOS
            xcode-version: "latest-stable"
            macos-version: "15"
          - platform: iOS
            platform-version: ~18.2
            macos-version: "14"
            xcode-version: "16.2"

          - platform: watchOS
            macos-version: "15"
          - platform: watchOS
            platform-version: ~11.1
            macos-version: "14"
            xcode-version: "16.2"

          - platform: tvOS
            macos-version: "15"
          - platform: tvOS
            platform-version: ~18.2
            macos-version: "14"
            xcode-version: "16.2"

          - platform: visionOS
            macos-version: "15"

          - platform: macOS
          - platform: macOS
            macos-version: "14"
          - platform: macOS
            arch: x86_64
            macos-version: "15"

          - platform: mac-catalyst
          - platform: mac-catalyst
            macos-version: "14"

          # Xcode 27 preview (macOS 26 + Xcode 27.0 beta). Non-blocking early
          # warning on the 27.0 SDKs. See actions/runner-images#14404.
          - platform: iOS
            runner: xcode-27
            xcode-version: latest
            experimental: true
          - platform: macOS
            runner: xcode-27
            xcode-version: latest
            experimental: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # Beta-only images must ask for 'latest', not 'latest-stable': setup-xcode
      # marks any Xcode whose LicenseInfo.plist says "beta" as unstable, and
      # ignores the /Applications/Xcode_27.0.app symlinks because it skips
      # symlinks entirely. On the xcode-27 image that leaves 'latest-stable'
      # matching nothing, which fails the step rather than falling back.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version || 'latest-stable' }}

      - name: Ensure the Platform is Downloaded
        if: ${{ matrix.platform != 'macOS' && matrix.platform != 'mac-catalyst' }}
        run: |
          xcodebuild -runFirstLaunch
          xcrun simctl list
          xcodebuild -downloadPlatform ${{ matrix.platform }}
          xcodebuild -runFirstLaunch

      - name: Run Unit Tests
        if: ${{ matrix.arch != 'x86_64' }}
        uses: mxcl/xcodebuild@v3
        timeout-minutes: 30
        with:
          workspace: ".swiftpm/xcode/package.xcworkspace"
          scheme: "KSCrash-Package"
          platform: ${{ matrix.platform }}
          platform-version: ${{ matrix.platform-version }}

      - name: Run Unit Tests (x86_64 via Rosetta)
        if: ${{ matrix.arch == 'x86_64' }}
        timeout-minutes: 30
        run: |
          brew install xcbeautify
          set -o pipefail && xcodebuild test \
            -workspace .swiftpm/xcode/package.xcworkspace \
            -scheme KSCrash-Package \
            -destination 'platform=macOS,arch=x86_64' \
            | xcbeautify
